name: Cek AI

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tes penyedia AI (tanpa trading)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODEL: ${{ vars.GH_MODEL }}
          ARCEE_API_KEY: ${{ secrets.ARCEE_API_KEY }}
          ARCEE_MODEL: ${{ vars.ARCEE_MODEL }}
        run: python bot/aibot.py probe
