name: Cek AI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tes penyedia AI (tanpa trading)
        env:
          NAFNAF_API_KEY: ${{ secrets.NAFNAF_API_KEY }}
          NAFNAF_MODEL: ${{ vars.NAFNAF_MODEL }}
          GONKA_API_KEY: ${{ secrets.GONKA_API_KEY }}
          GONKA_MODEL: ${{ vars.GONKA_MODEL }}
          ARCEE_API_KEY: ${{ secrets.ARCEE_API_KEY }}
          ARCEE_MODEL: ${{ vars.ARCEE_MODEL }}
        run: python bot/aibot.py probe
